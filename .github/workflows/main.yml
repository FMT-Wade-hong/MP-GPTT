name: FMTPlanner Windows Build

on:
  push:
    branches:
      - "**"
    tags:
      - "FMTPlanner-v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 10

      - name: Build
        shell: pwsh
        run: |
          $msbuildPath = Split-Path (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1) -Parent
          $env:PATH = $msbuildPath + ';' + $env:PATH
          nuget locals all -clear
          msbuild -v:m -restore -t:Build -p:Configuration=Release MissionPlanner.sln

      - name: Cleanup
        shell: pwsh
        run: |
          Get-ChildItem bin\Release\net461\plugins -File -ErrorAction SilentlyContinue |
            Remove-Item -Force

      - name: Package single-file portable launcher
        shell: pwsh
        run: |
          .\FMT\Build-FMTPlannerPackage.ps1
          Get-FileHash bin\Package\FMTPlanner.exe -Algorithm SHA256 | Format-List
          
      - uses: actions/upload-artifact@v4
        with:
          name: FMTPlanner-Windows-Portable
          path: bin\Package\FMTPlanner.exe

      - name: Publish tagged GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/FMTPlanner-v')
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG-FMT.md
          files: bin/Package/FMTPlanner.exe
          fail_on_unmatched_files: true


  buildDebug:
    name: Build Debug
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 10

      - name: Cache multiple paths
        uses: actions/cache@v4
        with:
          path: |
            **/obj/**
          key: ${{ runner.os }}-buildDebug

      - name: Build
        shell: pwsh
        run: |
          $msbuildPath = Split-Path (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1) -Parent
          $env:PATH = $msbuildPath + ';' + $env:PATH
          nuget locals all -clear
          msbuild -v:m -restore -t:Build -p:Configuration=Debug MissionPlanner.sln

      - name: Cleanup
        shell: pwsh
        run: |
          cd bin\Debug\net461
          gci plugins | ForEach-Object {                 if (Test-Path $_.Name -PathType Leaf)                {                    Write-Host "Remove" $_.FullName   ;                 Remove-Item $_.FullName                            } else {                    Write-Host $_.Name                }            }

      - uses: actions/upload-artifact@v4
        with:
          name: FeiMaoTecPlanner-V1-Windows-Debug
          path: bin\Debug\net461
